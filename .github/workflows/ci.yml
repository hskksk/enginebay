name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hskksk/gh-actions/setup-pnpm@v1
        with:
          pnpm-version: "11.25.0"
          node-version: "22.14.0"
          cache: "true"
          install: "true"
          frozen-lockfile: "true"

      - run: pnpm build
      - run: pnpm test
      - run: pnpm typecheck
