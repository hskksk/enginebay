name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hskksk/gh-actions/actions/setup-mise@v1

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
      - run: pnpm test
      - run: pnpm typecheck
