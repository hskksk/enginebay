name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write # npm trusted publishing (OIDC)

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      # Do not set registry-url here — semantic-release + OIDC conflict with setup-node's .npmrc.
      # https://semantic-release.org/recipes/ci-configurations/github-actions/
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm

      # npm stage requires CLI >= 11.15.0; trusted publishing needs >= 11.5.1 and Node >= 22.14.0.
      - run: npm install -g npm@^11.15.0

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
