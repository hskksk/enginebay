name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    uses: hskksk/gh-actions/.github/workflows/opencode.yml@v1
    secrets: inherit
    with:
      toolchain: pnpm
      pnpm-version: "11.25.0"
      node-version: "22.14.0"
      trigger-allowlist: ${{ vars.OPENCODE_TRIGGER_ALLOWLIST }}
